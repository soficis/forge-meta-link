name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (example: v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - label: windows-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - label: windows-arm64
            runner: windows-latest
            rust_target: aarch64-pc-windows-msvc
            bundles: msi,nsis
          - label: macos-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundles: app
            bundle_arch: x64
          - label: macos-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            bundles: app
            bundle_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps (Tauri)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Prefetch Windows bundler tools (NSIS/WiX) with retry
        if: startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          function Download-WithRetry([string]$Url, [string]$OutFile, [int]$MaxAttempts = 5) {
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                Write-Host "Downloading $Url (attempt $attempt/$MaxAttempts)"
                Invoke-WebRequest -Uri $Url -OutFile $OutFile -TimeoutSec 180
                if (-not (Test-Path $OutFile)) {
                  throw "File not created: $OutFile"
                }
                $size = (Get-Item $OutFile).Length
                if ($size -le 0) {
                  throw "Downloaded file is empty: $OutFile"
                }
                Write-Host "Downloaded $(Split-Path $OutFile -Leaf) ($size bytes)"
                return
              } catch {
                if ($attempt -ge $MaxAttempts) {
                  throw "Failed to download $Url after $MaxAttempts attempts. $($_.Exception.Message)"
                }
                $sleepSeconds = 10 * $attempt
                Write-Warning "Download failed: $($_.Exception.Message). Retrying in $sleepSeconds seconds..."
                Start-Sleep -Seconds $sleepSeconds
              }
            }
          }

          $prefetchDir = Join-Path $env:RUNNER_TEMP "tauri-bundler-prefetch"
          New-Item -ItemType Directory -Path $prefetchDir -Force | Out-Null

          Download-WithRetry "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" (Join-Path $prefetchDir "wix314-binaries.zip")
          Download-WithRetry "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip" (Join-Path $prefetchDir "nsis-3.11.zip")
          Download-WithRetry "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll" (Join-Path $prefetchDir "nsis_tauri_utils.dll")

          Write-Host "Prefetched tool artifacts:"
          Get-ChildItem $prefetchDir | Select-Object Name, Length

      - name: Build release bundle
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        run: npm run tauri -- build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      - name: Build release bundle (Windows retry on transient download failures)
        if: startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $maxAttempts = 4
          $succeeded = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Starting Windows bundle build attempt $attempt of $maxAttempts..."
            npm run tauri -- build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
            if ($LASTEXITCODE -eq 0) {
              $succeeded = $true
              break
            }

            if ($attempt -lt $maxAttempts) {
              $sleepSeconds = 15 * $attempt
              Write-Warning "Build failed with exit code $LASTEXITCODE. Retrying in $sleepSeconds seconds..."
              Start-Sleep -Seconds $sleepSeconds
            }
          }

          if (-not $succeeded) {
            throw "Windows bundle build failed after $maxAttempts attempts."
          }

      - name: Build macOS DMG (manual fallback to avoid bundle_dmg.sh failures)
        if: startsWith(matrix.runner, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          APP_PATH="${BUNDLE_ROOT}/macos/forge-meta-link.app"
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "App bundle not found at ${APP_PATH}" >&2
            exit 1
          fi

          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          DMG_DIR="${BUNDLE_ROOT}/dmg"
          DMG_PATH="${DMG_DIR}/forge-meta-link_${VERSION}_${{ matrix.bundle_arch }}.dmg"
          mkdir -p "${DMG_DIR}"

          # Stage the .app in a temp directory so hdiutil doesn't hit a busy build output path.
          TEMP_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/forgemetalink-dmg.XXXXXX")"
          STAGED_APP="${TEMP_ROOT}/forge-meta-link.app"
          TEMP_DMG="${TEMP_ROOT}/forge-meta-link_${VERSION}_${{ matrix.bundle_arch }}.dmg"
          trap 'rm -rf "${TEMP_ROOT}"' EXIT
          ditto "${APP_PATH}" "${STAGED_APP}"

          # Best effort: detach stale mounted images using the same volume name.
          while read -r device; do
            [[ -z "${device}" ]] && continue
            hdiutil detach "${device}" -force || true
          done < <(
            hdiutil info | awk '/^\/dev\//{dev=$1} /\/Volumes\/ForgeMetaLink/{print dev}'
          )

          rm -f "${DMG_PATH}"
          attempt=1
          until hdiutil create -volname "ForgeMetaLink" -srcfolder "${STAGED_APP}" -ov -format UDZO "${TEMP_DMG}"; do
            if [[ "${attempt}" -ge 3 ]]; then
              echo "hdiutil create failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "hdiutil create failed (attempt ${attempt}); retrying..."
            sleep $(( attempt * 5 ))
            attempt=$(( attempt + 1 ))
          done

          mv "${TEMP_DMG}" "${DMG_PATH}"
          ls -lah "${DMG_DIR}"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/**
          if-no-files-found: error

  release:
    name: Create and publish GitHub release
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Show downloaded artifacts
        shell: bash
        run: |
          find release-artifacts -type f \
            \( -name 'forge-meta-link_*.deb' \
            -o -name 'forge-meta-link_*.AppImage' \
            -o -name 'forge-meta-link_*.dmg' \
            -o -name 'forge-meta-link_*.msi' \
            -o -name 'forge-meta-link_*.exe' \) \
            | sort

      - name: Create/Update Github Release 
        uses: docker://ghcr.io/mini-bomba/create-github-release:v1.2.0
        env:
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ steps.release_tag.outputs.value }}
          INPUT_NAME: ${{ steps.release_tag.outputs.value }}
          INPUT_BODY: |
            ForgeMetaLink release ${{ steps.release_tag.outputs.value }}

            Automated release created by GitHub Actions.
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Build artifacts are uploaded by the next workflow step.

      - name: Upload assets to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' candidate_files < <(
            find release-artifacts -type f \
              \( -name 'forge-meta-link_*.deb' \
              -o -name 'forge-meta-link_*.AppImage' \
              -o -name 'forge-meta-link_*.dmg' \
              -o -name 'forge-meta-link_*.msi' \
              -o -name 'forge-meta-link_*.exe' \) \
              -print0
          )

          declare -A release_assets=()
          for file_path in "${candidate_files[@]}"; do
            asset_name="$(basename "${file_path}")"
            if [[ -n "${release_assets[$asset_name]:-}" ]]; then
              echo "Skipping duplicate asset filename: ${asset_name}"
              continue
            fi
            release_assets["$asset_name"]="${file_path}"
          done

          if [[ "${#release_assets[@]}" -eq 0 ]]; then
            echo "No release package artifacts found in release-artifacts/."
            exit 1
          fi

          mapfile -t asset_names < <(printf '%s\n' "${!release_assets[@]}" | sort)

          for asset_name in "${asset_names[@]}"; do
            file_path="${release_assets[$asset_name]}"
            echo "Uploading ${asset_name} (--clobber)"
            gh release upload "${RELEASE_TAG}" "${file_path}" --clobber
          done
